name: Deploy Worker

on:
  push:
    branches: [main]
    paths: ['edge/**']

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # Install the lockfile's Wrangler 4 so wrangler-action uses it instead of its own
      # default (3.90), which silently drops the [[ratelimits]] bindings in wrangler.toml.
      - run: npm ci
        working-directory: edge
      # Create/alter the search-analytics tables (edge/migrations) before the code that uses them.
      - name: Apply D1 migrations
        working-directory: edge
        run: npx wrangler d1 migrations apply reelscout-analytics --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: edge
          command: deploy
      # Smoke test: the new version answers, and the lockdown is still in place.
      - name: Check the live relay
        run: |
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors https://reelscout.bitterinfantproductions.com/api/health | grep -q '"status":"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' https://reelscout.bitterinfantproductions.com/api/tmdb/account)" = 404
          curl -fsS https://reelscout.bitterinfantproductions.com/api/stats | grep -q '"total_searches"'
