name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-kmp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
      - run: chmod +x gradlew
      - name: Test :shared (commonTest, jvm)
        run: ./gradlew :shared:desktopTest
      - name: Assemble Android debug
        run: ./gradlew :androidApp:assembleDebug
      - name: Build Wasm/Web distribution
        run: ./gradlew :composeApp:wasmJsBrowserDistribution

  typecheck-edge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install
      - run: npm run typecheck
      - run: npm test
