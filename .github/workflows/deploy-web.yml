name: Deploy Web

on:
  push:
    branches: [main]
    paths: ['composeApp/**', 'shared/**']

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: chmod +x gradlew
      - run: ./gradlew :composeApp:wasmJsBrowserDistribution
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy composeApp/build/dist/wasmJs/productionExecutable --project-name=reelscout-web
      # Smoke test: the custom domain serves the app, not a Pages error page.
      - name: Check the live site
        run: |
          # The loader must be versioned (composeApp/build.gradle.kts), or browsers keep the
          # previous build for the zone's 4-hour .js cache. The edge can serve the previous
          # index.html for a few seconds after "Deployment complete", so poll for up to a minute.
          site=https://reelscout.bitterinfantproductions.com
          expected=$(grep -o 'reelscout\.js?v=[0-9a-f]*' composeApp/build/dist/wasmJs/productionExecutable/index.html)
          for attempt in $(seq 1 12); do
            page=$(curl -fsS "$site/" || true)
            if echo "$page" | grep -q '<title>ReelScout</title>' && echo "$page" | grep -qF "$expected"; then
              curl -fsS -o /dev/null "$site/$expected"
              echo "Live site serves this build ($expected)"
              exit 0
            fi
            sleep 5
          done
          echo "Live index.html never referenced $expected"
          exit 1
