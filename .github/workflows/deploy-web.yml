name: Deploy Web

on:
  push:
    branches: [main]
    paths: ['composeApp/**', 'shared/**']

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: chmod +x gradlew
      - run: ./gradlew :composeApp:wasmJsBrowserDistribution
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy composeApp/build/dist/wasmJs/productionExecutable --project-name=reelscout-web
      # Smoke test: the custom domain serves the app, not a Pages error page.
      - name: Check the live site
        run: |
          page=$(curl -fsS --retry 5 --retry-delay 5 --retry-all-errors https://reelscout.bitterinfantproductions.com/)
          echo "$page" | grep -q '<title>ReelScout</title>'
          # The loader must be versioned (composeApp/build.gradle.kts), or browsers keep the
          # previous build for the zone's 4-hour .js cache. Check it's there and loads.
          loader=$(echo "$page" | grep -o 'reelscout\.js?v=[0-9a-f]*')
          test -n "$loader"
          curl -fsS -o /dev/null "https://reelscout.bitterinfantproductions.com/$loader"
