name = "reelscout-relay"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# Routed under the reelscout subdomain instead of a workers.dev URL - only the /api/*
# path hits this Worker; everything else on the subdomain is served by the Pages
# project (the Compose Multiplatform Wasm/Web build). Requires the
# bitterinfantproductions.com zone to be Active in Cloudflare before `wrangler deploy`
# can create this route.
routes = [
  { pattern = "reelscout.bitterinfantproductions.com/api/*", zone_name = "bitterinfantproductions.com" }
]

# Secrets (never put real values here - set them with `wrangler secret put <NAME>`):
#   ANTHROPIC_API_KEY
#   TMDB_API_KEY
#   WATCHMODE_API_KEY

# Per-client-IP rate limits (see rateLimited() in src/index.ts). One question can take up
# to 6 Claude calls (AgentLoop.maxTurns) plus a handful of data lookups, so these allow a
# few questions a minute per person. namespace_id just has to be unique in the account.
[[ratelimits]]
name = "ANTHROPIC_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "DATA_LIMITER"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

# Search analytics (src/analytics.ts). Create the database once with
#   npx wrangler d1 create reelscout-analytics
# and paste the database_id it prints below. deploy-worker.yml applies migrations/.
[[d1_databases]]
binding = "DB"
database_name = "reelscout-analytics"
database_id = "b400ee0f-2e63-4fdf-a462-1b399934d5c0"
migrations_dir = "migrations"
